name: Build Digital Dehazing APK
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-clearsight-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: digital-dehazing-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Digital Dehazing Android source
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/sergioovcharenko/Dehaze-Web.git legacy
          cp -R legacy/android-max android-clearsight
          rm -rf legacy
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android-clearsight/app/build.gradle')
          s=p.read_text()
          s=s.replace("applicationId 'ua.digitaldehazing.metituman.adaptiveobjectmax'","applicationId 'ua.clearsight.dehaze'")
          s=s.replace("versionCode 9","versionCode 1")
          s=s.replace("versionName '2.2.4'","versionName '1.0.0'")
          p.write_text(s)

          p=Path('android-clearsight/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          s=s.replace('android:label="Digital Dehazing Adaptive MAX"','android:label="Digital Dehazing"')
          p.write_text(s)

          p=Path('android-clearsight/app/src/main/java/ua/dehaze/live/MainActivity.java')
          s=p.read_text()
          s=s.replace('Digital Dehazing • Adaptive MAX','Digital Dehazing')
          s=s.replace('DIGITAL DEHAZING • МЕТІ ТУМАН ADAPTIVE MAX • ОФЛАЙН','DIGITAL DEHAZING • ОФЛАЙН')
          p.write_text(s)
          PY
      - name: Configure Android SDK
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          tool="$sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$tool" --licenses >/dev/null 2>&1 || true
          "$tool" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: gradle -p android-clearsight --no-daemon --stacktrace assembleDebug
      - name: Verify package
        run: |
          set -euo pipefail
          apk=android-clearsight/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          "${ANDROID_HOME}/build-tools/35.0.0/aapt" dump badging "$apk" | grep '^package:' | tee package.txt
          grep "name='ua.clearsight.dehaze'" package.txt
          cp "$apk" Digital-Dehazing-1.0.0.apk
          sha256sum Digital-Dehazing-1.0.0.apk > Digital-Dehazing-1.0.0.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Digital-Dehazing-APK
          path: |
            Digital-Dehazing-1.0.0.apk
            Digital-Dehazing-1.0.0.apk.sha256
          retention-days: 90
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=digital-dehazing-v1.0.0
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "Digital Dehazing v1.0.0" --notes "Offline Android build with Camera2/OpenGL live dehazing, photo/video viewing, zoom, freeze-frame and independent package ua.clearsight.dehaze." --prerelease
          fi
          gh release upload "$tag" Digital-Dehazing-1.0.0.apk Digital-Dehazing-1.0.0.apk.sha256 --clobber
