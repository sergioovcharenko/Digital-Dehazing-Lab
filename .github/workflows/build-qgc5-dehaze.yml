name: QGC5 Dehaze Android

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      QT_VERSION: "6.6.3"
      QT_ANDROID_ABIS: "arm64-v8a"

    steps:
      - name: Checkout lab
        uses: actions/checkout@v4
        with:
          ref: qgc-dehaze-lab
          path: lab

      - name: Checkout QGC
        uses: actions/checkout@v4
        with:
          repository: mavlink/qgroundcontrol
          ref: v5.0.8
          submodules: recursive
          fetch-depth: 1
          path: qgc

      - name: Apply overlay
        shell: bash
        run: |
          cp -a lab/qgc-dehaze/qgc5-overlay/. qgc/
          mkdir -p artifacts

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup_ndk
        with:
          ndk-version: r25b
          add-to-path: false

      - name: Export NDK
        shell: bash
        run: |
          echo "ANDROID_NDK_ROOT=${{ steps.setup_ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${{ steps.setup_ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=${{ steps.setup_ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

      - name: Install Qt host
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.6.3"
          host: linux
          target: desktop
          arch: gcc_64
          dir: ${{ runner.temp }}
          modules: "qtcharts qtlocation qtpositioning qtspeech qt5compat qtmultimedia qtserialport qtimageformats qtshadertools qtconnectivity qtquick3d qtsensors"
          setup-python: false
          cache: true

      - name: Save Qt host path
        shell: bash
        run: echo "QT_HOST_ROOT=${QT_ROOT_DIR}" >> "$GITHUB_ENV"

      - name: Install Qt Android arm64
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.6.3"
          host: linux
          target: android
          arch: android_arm64_v8a
          dir: ${{ runner.temp }}
          modules: "qtcharts qtlocation qtpositioning qtspeech qt5compat qtmultimedia qtserialport qtimageformats qtshadertools qtconnectivity qtquick3d qtsensors"
          setup-python: false
          cache: true

      - name: Create test signing key
        shell: bash
        run: |
          keytool -genkeypair -v \
            -keystore "${{ runner.temp }}/dehaze-lab.keystore" \
            -storepass dehazelab2026 \
            -keypass dehazelab2026 \
            -alias dehazelab \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=QGC Dehaze Lab, OU=Lab, O=Dehaze Lab, L=Kyiv, C=UA"

      - name: Configure
        shell: bash
        run: |
          mkdir -p "${{ runner.temp }}/qgc5-build"
          "${QT_ROOT_DIR}/bin/qt-cmake" -S "${GITHUB_WORKSPACE}/qgc" -B "${{ runner.temp }}/qgc5-build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_WARN_DEPRECATED=FALSE -DQT_ANDROID_ABIS=arm64-v8a -DQT_ANDROID_BUILD_ALL_ABIS=OFF -DQT_HOST_PATH="${QT_HOST_ROOT}" -DQT_ANDROID_SIGN_APK=OFF -DQGC_ENABLE_HERELINK=ON -DQGC_STABLE_BUILD=OFF

      - name: Build
        shell: bash
        run: |
          cmake --build "${{ runner.temp }}/qgc5-build" --target all --config Release
          find "${{ runner.temp }}/qgc5-build" -type f -name "*.apk" -print
          APK=$(find "${{ runner.temp }}/qgc5-build" -type f -name "*.apk" | head -n 1)
          test -n "$APK"
          cp "$APK" artifacts/QGC-5.0.8-Dehaze-Lab-UNSIGNED.apk

      - name: Sign and verify APK
        shell: bash
        run: |
          BUILD_TOOLS="$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          APKSIGNER="${BUILD_TOOLS}/apksigner"
          AAPT="${BUILD_TOOLS}/aapt"
          test -x "$APKSIGNER"
          "$APKSIGNER" sign \
            --ks "${{ runner.temp }}/dehaze-lab.keystore" \
            --ks-key-alias dehazelab \
            --ks-pass pass:dehazelab2026 \
            --key-pass pass:dehazelab2026 \
            --out artifacts/QGC-5.0.8-Dehaze-Lab-Samsung-FE-arm64.apk \
            artifacts/QGC-5.0.8-Dehaze-Lab-UNSIGNED.apk
          "$APKSIGNER" verify --verbose --print-certs artifacts/QGC-5.0.8-Dehaze-Lab-Samsung-FE-arm64.apk
          "$AAPT" dump badging artifacts/QGC-5.0.8-Dehaze-Lab-Samsung-FE-arm64.apk | head -n 5
          "$AAPT" dump badging artifacts/QGC-5.0.8-Dehaze-Lab-Samsung-FE-arm64.apk | grep -q "package: name='org.mavlink.qgroundcontrol.dehazelab'"

      - name: Package source overlay
        if: always()
        shell: bash
        run: |
          cd lab
          zip -qr ../artifacts/QGC-5.0.8-Dehaze-Lab-SOURCE-OVERLAY.zip qgc-dehaze/qgc5-overlay
          cd ..

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: QGC-5.0.8-Dehaze-Lab-APK
          path: artifacts/QGC-5.0.8-Dehaze-Lab-Samsung-FE-arm64.apk

      - name: Upload source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QGC-5.0.8-Dehaze-Lab-Source
          path: artifacts/QGC-5.0.8-Dehaze-Lab-SOURCE-OVERLAY.zip
