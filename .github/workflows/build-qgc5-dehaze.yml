name: QGC5 Dehaze Android

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      QT_VERSION: "6.8.3"
      QT_ANDROID_ABIS: "arm64-v8a"

    steps:
      - name: Checkout lab
        uses: actions/checkout@v4
        with:
          ref: qgc-dehaze-lab
          path: lab

      - name: Checkout QGC
        uses: actions/checkout@v4
        with:
          repository: mavlink/qgroundcontrol
          ref: v5.0.8
          submodules: recursive
          fetch-depth: 1
          path: qgc

      - name: Apply overlay
        shell: bash
        run: |
          cp -a lab/qgc-dehaze/qgc5-overlay/. qgc/
          mkdir -p artifacts

      - name: QGC common setup
        uses: ./qgc/.github/actions/common

      - name: Install Qt Android
        uses: ./qgc/.github/actions/qt-android
        with:
          host: linux
          arch: linux_gcc_64
          version: "6.8.3"
          abis: "arm64-v8a"
          cpm-modules: ${{ runner.temp }}/shadow_build_dir/cpm_modules

      - name: Configure
        shell: bash
        run: |
          mkdir -p "${{ runner.temp }}/qgc5-build"
          "${QT_ROOT_DIR}/bin/qt-cmake" -S "${GITHUB_WORKSPACE}/qgc" -B "${{ runner.temp }}/qgc5-build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_WARN_DEPRECATED=FALSE -DQT_ANDROID_ABIS=arm64-v8a -DQT_ANDROID_BUILD_ALL_ABIS=OFF -DQT_HOST_PATH="${QT_ROOT_DIR}/../gcc_64" -DQT_ANDROID_SIGN_APK=OFF -DQGC_STABLE_BUILD=OFF

      - name: Build
        shell: bash
        run: |
          cmake --build "${{ runner.temp }}/qgc5-build" --target all --config Release
          find "${{ runner.temp }}/qgc5-build" -type f -name "*.apk" -print
          APK=$(find "${{ runner.temp }}/qgc5-build" -type f -name "*.apk" | head -n 1)
          test -n "$APK"
          cp "$APK" artifacts/QGC-5.0.8-Dehaze-Lab-Samsung-FE-arm64.apk

      - name: Package source overlay
        if: always()
        shell: bash
        run: |
          cd lab
          zip -qr ../artifacts/QGC-5.0.8-Dehaze-Lab-SOURCE-OVERLAY.zip qgc-dehaze/qgc5-overlay
          cd ..

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: QGC-5.0.8-Dehaze-Lab-APK
          path: artifacts/QGC-5.0.8-Dehaze-Lab-Samsung-FE-arm64.apk

      - name: Upload source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QGC-5.0.8-Dehaze-Lab-Source
          path: artifacts/QGC-5.0.8-Dehaze-Lab-SOURCE-OVERLAY.zip
