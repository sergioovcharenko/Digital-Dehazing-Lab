<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#0b0f14"/>
<title>Digital Dehazing Lab</title>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="stylesheet" href="styles.css"/>
<script src="vendor/ort.min.js"></script>
</head>
<body>
<header><h1>Digital Dehazing Lab</h1><div class="headState"><span id="offlineState">LOCAL</span></div></header>

<main>
<section class="toolbar">
  <div class="sources">
    <button id="photoBtn">Фото</button>
    <button id="videoBtn" class="active">Відео</button>
    <button id="liveBtn">LIVE</button>
    <input id="photoInput" type="file" accept="image/*" hidden>
    <input id="videoInput" type="file" accept="video/*" hidden>
  </div>

  <div class="algos" id="algos">
    <label><input type="radio" name="algo" value="original"> Original</label>
    <label><input type="radio" name="algo" value="classic"> Classic DCP</label>
    <label><input type="radio" name="algo" value="webl" checked> WebL / Adaptive MAX</label>
    <label><input type="radio" name="algo" value="edn"> EDN-GTM</label>
    <label><input type="radio" name="algo" value="aid"> AIDTransformer</label>
    <label><input type="radio" name="algo" value="hybrid"> Hybrid</label>
  </div>

  <div class="controls">
    <label>Strength <input id="strength" type="range" min="0" max="100" value="70"> <span id="strengthVal">70%</span></label>
    <label><input id="autoStrength" type="checkbox"> AUTO</label>
    <button id="saveFrame">Зберегти кадр</button>
  </div>

  <div class="cameraControls">
    <label>Zoom <input id="cameraZoom" type="range" min="1" max="6" step="0.1" value="1"> <span id="cameraZoomVal">1.0×</span></label>
    <button id="cameraResetZoom" type="button">1×</button>
  </div>

  <div class="viewModes" aria-label="Режим перегляду">
    <button data-view="split" class="active">50/50</button>
    <button data-view="two">2 кадри</button>
    <button data-view="mini">2 малі</button>
    <button data-view="processed">Оброблений</button>
  </div>
</section>

<section class="viewerWrap">
  <div id="status" class="status">Оберіть відео або запустіть LIVE.</div>
  <div id="viewerStage" class="viewerStage view-split">
    <div id="originalPane" class="framePane originalPane">
      <video id="video" playsinline muted></video>
      <img id="photo" alt="" hidden>
      <div class="frameTag">ORIGINAL</div>
    </div>
    <div id="processedPane" class="framePane processedPane">
      <canvas id="canvas"></canvas>
      <div class="frameTag right" id="algoLabel">WEBL</div>
    </div>
  </div>

  <div class="transport">
    <button id="play">▶</button>
    <input id="seek" type="range" min="0" max="1000" value="0">
    <span id="time">00:00 / 00:00</span>
  </div>

  <div class="processingBar">
    <span><b>Engine:</b> <span id="engineStat">WEBL</span></span>
    <span><b>Processing:</b> <span id="latency">— ms</span></span>
    <span><b>FPS:</b> <span id="fps">— FPS</span></span>
    <span><b>Source:</b> <span id="sourceStat">—</span></span>
    <span><b>Output:</b> <span id="outputStat">—</span></span>
  </div>
</section>

<section class="bench">
  <h2>Порівняння</h2>
  <div class="cards">
    <div><b>Classic DCP</b><span id="bClassic">не тестовано</span></div>
    <div><b>WebL</b><span id="bWebl">не тестовано</span></div>
    <div><b>EDN-GTM</b><span id="bEdn">модель не завантажена</span></div>
    <div><b>AIDTransformer</b><span id="bAid">модель не завантажена</span></div>
  </div>
</section>
</main>

<script src="classic-dcp.js"></script>
<script src="app.js"></script>
</body>
</html>
