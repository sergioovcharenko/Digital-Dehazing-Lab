<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#ffffff"/>
<title>Digital Dehazing — New UI</title>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="icon" type="image/png" sizes="192x192" href="icons/clearsight-192.png"/>
<link rel="apple-touch-icon" href="icons/clearsight-192.png"/>
<link rel="stylesheet" href="styles.css?v=20261006-10"/>
</head>
<body>
<div class="appShell">
  <header class="topbar">
    <div class="brand"><img class="brandIcon" src="icons/clearsight-192.png" alt=""><div><strong>Digital Dehazing</strong><small><span class="liveDot"></span><span id="headerFps">— FPS</span></small></div></div>
    <div class="sourceSwitcher">
      <button id="photoBtn"><span>▧</span>Фото</button>
      <button id="videoBtn"><span>▶</span>Відео</button>
      <button id="liveBtn" class="active"><span>◉</span>Камера</button>
    </div>
    <span id="offlineState" class="netState">LOCAL</span>
  </header>

  <input id="photoInput" type="file" accept="image/*" hidden>
  <input id="videoInput" type="file" accept="video/*" hidden>

  <main class="viewerPage">
    <div id="viewerStage" class="viewerStage view-split">
      <div id="originalPane" class="framePane originalPane">
        <video id="video" playsinline muted></video>
        <img id="photo" alt="" hidden>
        <div class="frameTag">ORIGINAL</div>
      </div>
      <div id="processedPane" class="framePane processedPane">
        <canvas id="canvas"></canvas>
        <div class="frameTag right" id="algoLabel">AUTO</div>
      </div>
    </div>

    <div id="status" class="statusPill">Готово</div>

    <div class="bottomOverlay">
      <div class="transport" id="transportBar" hidden>
        <button id="back10" class="roundBtn skipBtn" type="button">−10</button>
        <button id="play" class="roundBtn" type="button">▶</button>
        <button id="forward10" class="roundBtn skipBtn" type="button">+10</button>
        <input id="seek" type="range" min="0" max="1000" value="0">
        <span id="time">00:00 / 00:00</span>
      </div>

      <div class="processingBar">
        <span id="modeStat">AUTO</span>
        <span id="sceneStat">DAY</span>
        <span id="engineStat">WEBL</span>
        <span id="latency">— ms</span>
        <span id="fps">— FPS</span>
        <span id="sourceStat">—</span>
      </div>
    </div>

    <button id="freezeFrame" class="floatingAction freeze" type="button" aria-label="Стоп-кадр">Ⅱ</button>
    <button id="saveFrame" class="floatingAction shot" type="button"><span>▣</span><span class="actionText">Знімок</span></button>
    <button id="settingsBtn" class="floatingAction gear" type="button" aria-label="Налаштування">⚙</button>
  </main>

  <div id="settingsBackdrop" class="settingsBackdrop" hidden></div>
  <aside id="settingsPanel" class="settingsPanel" aria-hidden="true">
    <div class="sheetHandle"></div>
    <div class="sheetHeader">
      <strong>Налаштування</strong>
      <button id="settingsClose" class="closeBtn">×</button>
    </div>

    <section class="settingSection">
      <div class="settingTitle">Режим обробки</div>
      <div class="segmented">
        <button id="modeAuto" class="active">AUTO</button>
        <button id="modeManual">MANUAL</button>
      </div>
      <div id="manualLevels" class="segmented three" hidden>
        <button data-strength="35">LOW</button>
        <button data-strength="65" class="active">MEDIUM</button>
        <button data-strength="90">HIGH</button>
      </div>
      <input id="autoStrength" type="checkbox" checked hidden>
      <input id="strength" type="range" min="0" max="100" value="65" hidden>
      <span id="strengthVal" hidden>65%</span>
    </section>

    <section class="settingSection">
      <div class="settingTitle">Вигляд</div>
      <div class="viewModes">
        <button data-view="split" class="active">50/50</button>
        <button data-view="two">2 кадри</button>
        <button data-view="mini">2 малі</button>
        <button data-view="processed">На весь екран</button>
      </div>
      <div class="settingTitle subTitle">Напрямок поділу</div>
      <div class="segmented three" id="splitDirection">
        <button data-split="auto" class="active">AUTO</button>
        <button data-split="vertical">Вертикально</button>
        <button data-split="horizontal">Горизонтально</button>
      </div>
    </section>

    <section class="settingSection">
      <div class="settingTitle">Розширені алгоритми</div>
      <button id="advancedToggle" class="wideSettingBtn" type="button">Показати приховані режими</button>
      <div id="advancedAlgorithms" class="advancedAlgorithms" hidden>
        <label><input type="radio" name="algo" value="original"> OFF / Original</label>
        <label><input type="radio" name="algo" value="classic"> Classic DCP</label>
        <label><input type="radio" name="algo" value="webl" checked> WebL / Adaptive MAX</label>
        <label class="algoUnavailable"><input type="radio" name="algo" value="edn" disabled> EDN-GTM <small>не встановлено</small></label>
        <label class="algoUnavailable"><input type="radio" name="algo" value="aid" disabled> AIDTransformer <small>не встановлено</small></label>
        <label class="algoUnavailable"><input type="radio" name="algo" value="hybrid" disabled> Hybrid AI <small>не встановлено</small></label>
      </div>
    </section>

    <section class="settingSection cameraControls">
      <div class="settingTitle">Камера</div>
      <label>Якість
        <select id="cameraQuality">
          <option value="auto" selected>AUTO</option>
          <option value="1080">1080p</option>
          <option value="max">MAX</option>
        </select>
      </label>
      <label>FPS
        <select id="cameraFps">
          <option value="auto" selected>AUTO</option>
          <option value="30">30</option>
          <option value="60">60</option>
        </select>
      </label>
      <label>Zoom
        <input id="cameraZoom" type="range" min="1" max="6" step="0.1" value="1">
        <span id="cameraZoomVal">1.0×</span>
      </label>
      <button id="cameraResetZoom" type="button">Скинути zoom до 1×</button>
    </section>

    <div class="developerHidden" hidden>
      <span id="bClassic"></span><span id="bWebl"></span><span id="bEdn"></span><span id="bAid"></span>
    </div>
  </aside>
</div>

<script src="classic-dcp.js?v=20261006-10"></script>
<script src="app.js?v=20261006-10"></script>
</body>
</html>
